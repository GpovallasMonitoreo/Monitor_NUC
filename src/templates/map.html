<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argos Geo-Intelligence | Monitor Proactivo</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        #map { height: 100vh; width: 100%; z-index: 1; background: #0f172a; }
        .sidebar { 
            position: absolute; top: 10px; left: 10px; width: 380px; 
            max-height: 95vh; background: white; z-index: 1000; 
            border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
            display: flex; flex-direction: column; overflow: hidden;
        }
        .status-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-900">

<div id="map"></div>

<div class="sidebar border border-slate-200">
    <div class="p-5 bg-slate-900 text-white">
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-microchip text-indigo-400"></i> Argos Geo-Monitor
            </h2>
            <div id="live-indicator" class="flex items-center gap-1 text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded-full uppercase font-bold tracking-tighter">
                <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-ping"></span> Live
            </div>
        </div>
        <p class="text-[10px] opacity-50 mt-1 uppercase tracking-widest">Análisis de Latencia & Hardware</p>
    </div>

    <div class="grid grid-cols-3 gap-2 p-4 bg-white border-b">
        <div class="text-center p-2 bg-slate-50 rounded-xl border-b-4 border-rose-500">
            <div id="kpi-red" class="text-xl font-black text-slate-800">0</div>
            <div class="text-[9px] font-bold text-rose-500 uppercase">Críticos</div>
        </div>
        <div class="text-center p-2 bg-slate-50 rounded-xl border-b-4 border-amber-500">
            <div id="kpi-yellow" class="text-xl font-black text-slate-800">0</div>
            <div class="text-[9px] font-bold text-amber-500 uppercase">Atención</div>
        </div>
        <div class="text-center p-2 bg-slate-50 rounded-xl border-b-4 border-emerald-500">
            <div id="kpi-green" class="text-xl font-black text-slate-800">0</div>
            <div class="text-[9px] font-bold text-emerald-500 uppercase">Óptimos</div>
        </div>
    </div>

    <div class="px-4 py-3 bg-white border-b">
        <input type="text" id="search-input" placeholder="Filtrar NUC o Sitio..." 
               class="w-full px-4 py-2 bg-slate-100 border-none rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
               onkeyup="filtrarLista()">
    </div>

    <div id="unit-list" class="flex-1 overflow-y-auto custom-scrollbar bg-white p-2 space-y-1"></div>
</div>

<div id="modal-diag" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-md z-[2000] flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
        <div class="p-6 border-b flex justify-between items-center bg-slate-50">
            <div>
                <h3 id="diag-title" class="text-lg font-bold text-slate-800">Diagnóstico Proactivo</h3>
                <p id="diag-subtitle" class="text-xs text-slate-500 font-medium"></p>
            </div>
            <button onclick="cerrarModal()" class="text-slate-400 hover:text-slate-900"><i class="fa-solid fa-circle-xmark text-2xl"></i></button>
        </div>
        <div id="diag-content" class="p-6 space-y-4"></div>
        <div class="p-4 bg-slate-50 text-right">
            <button onclick="cerrarModal()" class="px-6 py-2 bg-slate-900 text-white rounded-xl text-sm font-bold">Cerrar</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // --- 1. INVENTARIO GEOGRÁFICO ---
    // El mapa busca el "name" que viene de Argos en este diccionario para saber dónde pintar.
    const geoInventory = {
        "MX_CM_VV_COL_669": { lat: 19.4270, lng: -99.1670 },
        "MX_CM_EV_MGP_15": { lat: 19.4350, lng: -99.1410 },
        "MX_CM_VV_COL_551": { lat: 19.4180, lng: -99.1620 }
    };

    let map, markers = {}, currentData = [];

    // --- 2. INICIALIZACIÓN ---
    function init() {
        map = L.map('map', { zoomControl: false }).setView([19.43, -99.15], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
        
        ejecutarCiclo();
        setInterval(ejecutarCiclo, 5000); // Sincronización cada 5 segundos
    }

    async function ejecutarCiclo() {
        await fetchData();
        renderizarInterfaz();
    }

    // --- 3. OBTENCIÓN DE DATOS (Lógica de Argos) ---
    async function fetchData() {
        try {
            // Aquí intentamos conectar con la API de Argos. 
            // Si falla (ej. en local), genera datos de simulación para que el mapa no esté vacío.
            const response = await fetch('/api/data').catch(() => null);
            if (response) {
                currentData = await response.json();
            } else {
                currentData = [
                    { name: "MX_CM_VV_COL_669", latency: 68, cpu_usage: 85, ram_usage: 40, unit: "NUC-V3", temp: 72 },
                    { name: "MX_CM_EV_MGP_15", latency: 12, cpu_usage: 25, ram_usage: 15, unit: "NUC-V2", temp: 45 },
                    { name: "MX_CM_VV_COL_551", latency: 35, cpu_usage: 62, ram_usage: 30, unit: "NUC-V3", temp: 58 }
                ];
            }
        } catch (e) { console.error("Error en datos:", e); }
    }

    // --- 4. RENDERIZACIÓN FUSIONADA ---
    function renderizarInterfaz() {
        const listCont = document.getElementById('unit-list');
        let kpis = { red: 0, yellow: 0, green: 0 };
        listCont.innerHTML = "";

        currentData.forEach(nuc => {
            const id = nuc.name.trim();
            const coords = geoInventory[id];

            // DETERMINACIÓN DE SEMÁFORO (Basado en sensores de Hardware del Código 2)
            let color = "#10b981"; // Verde (Óptimo)
            let statusClass = "";
            if (nuc.latency > 50 || nuc.cpu_usage > 75) {
                color = "#ef4444"; statusClass = "status-pulse"; kpis.red++;
            } else if (nuc.latency > 30 || nuc.cpu_usage > 60) {
                color = "#f59e0b"; kpis.yellow++;
            } else {
                kpis.green++;
            }

            // A. DIBUJAR EN MAPA (Lógica Perímetro 250m del Código 1)
            if (coords) {
                const offset = 0.001125; 
                const bounds = [[coords.lat - offset, coords.lng - offset], [coords.lat + offset, coords.lng + offset]];
                
                if (markers[id]) map.removeLayer(markers[id]);
                
                markers[id] = L.rectangle(bounds, {
                    color: color, weight: 1.5, fillColor: color, fillOpacity: 0.5, className: statusClass
                }).addTo(map);

                // Popup con info técnica de Argos
                markers[id].bindPopup(`
                    <div class="p-2 font-sans w-[220px]">
                        <div class="flex justify-between border-b pb-1 mb-2">
                            <b class="text-sm">${id}</b>
                            <span class="text-[9px] font-bold text-slate-400 uppercase">${nuc.unit}</span>
                        </div>
                        <div class="space-y-1 text-[11px]">
                            <div class="flex justify-between"><span>Latencia:</span> <b style="color:${color}">${nuc.latency}ms</b></div>
                            <div class="flex justify-between"><span>CPU:</span> <b>${nuc.cpu_usage}%</b></div>
                            <div class="flex justify-between"><span>Temp:</span> <b>${nuc.temp || 0}°C</b></div>
                        </div>
                        <button onclick="abrirDiagnostico('${id}')" class="mt-3 w-full bg-slate-900 text-white text-[10px] py-2 rounded-lg font-bold uppercase hover:bg-indigo-600 transition">
                            <i class="fa-solid fa-robot mr-1"></i> Análisis IA Argos
                        </button>
                    </div>
                `);
            }

            // B. RENDER EN LISTA LATERAL (Estilo Argos)
            listCont.innerHTML += `
                <div class="site-item p-4 border rounded-xl mb-2 cursor-pointer flex justify-between items-center transition-all bg-white shadow-sm hover:translate-x-1"
                     onclick="enfocarEnMapa('${id}', ${coords?.lat}, ${coords?.lng})">
                    <div>
                        <div class="text-[11px] font-bold text-slate-800">${id}</div>
                        <div class="text-[9px] text-slate-400 uppercase font-medium">Latencia: ${nuc.latency}ms</div>
                    </div>
                    <div class="text-right">
                        <div class="w-3 h-3 rounded-full shadow-inner" style="background:${color}"></div>
                    </div>
                </div>`;
        });

        // Actualizar Contadores Globales
        document.getElementById('kpi-red').innerText = kpis.red;
        document.getElementById('kpi-yellow').innerText = kpis.yellow;
        document.getElementById('kpi-green').innerText = kpis.green;
    }

    // --- 5. FUNCIONES DE APOYO (Heredadas de Argos) ---
    function abrirDiagnostico(id) {
        const nuc = currentData.find(u => u.name === id);
        if (!nuc) return;

        document.getElementById('diag-title').innerText = `Análisis Argos: ${id}`;
        document.getElementById('diag-subtitle').innerText = `Modelo: ${nuc.unit} | Diagnóstico Proactivo`;
        
        const content = document.getElementById('diag-content');
        content.innerHTML = "";

        // IA Argos: Recomendaciones dinámicas basadas en los datos nutritivos
        let hallazgos = [];
        if (nuc.latency > 50) hallazgos.push({icon: 'fa-wifi', color: 'text-rose-500', msg: 'Latencia crítica detectada. Posible degradación del switch o interferencia en la zona.'});
        if (nuc.cpu_usage > 75) hallazgos.push({icon: 'fa-bolt', color: 'text-amber-500', msg: 'Consumo de recursos elevado. Se sugiere revisar procesos de mantenimiento pendientes.'});
        if (hallazgos.length === 0) hallazgos.push({icon: 'fa-check-double', color: 'text-emerald-500', msg: 'La unidad se encuentra operando dentro de los estándares de salud corporativos.'});

        hallazgos.forEach(h => {
            content.innerHTML += `
                <div class="flex gap-4 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <i class="fa-solid ${h.icon} ${h.color} text-xl mt-1"></i>
                    <p class="text-[11px] text-slate-600 leading-relaxed">${h.msg}</p>
                </div>`;
        });

        document.getElementById('modal-diag').classList.remove('hidden');
    }

    function enfocarEnMapa(id, lat, lng) {
        if (!lat) return alert("Esta unidad no tiene coordenadas asignadas.");
        map.flyTo([lat, lng], 17);
        markers[id].openPopup();
    }

    function cerrarModal() { document.getElementById('modal-diag').classList.add('hidden'); }
    function filtrarLista() {
        const q = document.getElementById('search-input').value.toLowerCase();
        document.querySelectorAll('.site-item').forEach(el => el.style.display = el.innerText.toLowerCase().includes(q) ? 'flex' : 'none');
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
