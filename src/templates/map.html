<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argos Intelligence | Monitor Geoespacial</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        #map { height: 100vh; width: 100%; z-index: 1; background: #f8fafc; }
        .sidebar { 
            position: absolute; top: 10px; left: 10px; width: 380px; 
            max-height: 95vh; background: white; z-index: 1000; 
            border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            display: flex; flex-direction: column; overflow: hidden;
        }
        .status-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 
            0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } 
        }
        .custom-popup .leaflet-popup-content-wrapper { border-radius: 12px; padding: 0; overflow: hidden; }
        .site-list::-webkit-scrollbar { width: 4px; }
        .site-list::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100">

<div id="map"></div>

<div class="sidebar border border-slate-200">
    <div class="p-5 bg-slate-900 text-white">
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-satellite-dish text-indigo-400"></i> Argos Geo-Monitor
            </h2>
            <span id="sync-indicator" class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded-full uppercase font-bold tracking-tighter">Live</span>
        </div>
        <p class="text-[10px] opacity-50 mt-1 uppercase tracking-widest">Fusión de Datos: Latencia & Hardware</p>
    </div>

    <div class="grid grid-cols-3 gap-2 p-4 bg-white border-b">
        <div class="text-center p-2 bg-slate-50 rounded-xl border-b-4 border-rose-500">
            <div id="count-red" class="text-xl font-black text-slate-800">0</div>
            <div class="text-[9px] font-bold text-rose-500 uppercase">Críticos</div>
        </div>
        <div class="text-center p-2 bg-slate-50 rounded-xl border-b-4 border-amber-500">
            <div id="count-yellow" class="text-xl font-black text-slate-800">0</div>
            <div class="text-[9px] font-bold text-amber-500 uppercase">Atención</div>
        </div>
        <div class="text-center p-2 bg-slate-50 rounded-xl border-b-4 border-emerald-500">
            <div id="count-green" class="text-xl font-black text-slate-800">0</div>
            <div class="text-[9px] font-bold text-emerald-500 uppercase">Óptimos</div>
        </div>
    </div>

    <div class="px-4 py-3 bg-white">
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
            <input type="text" id="site-search" placeholder="Buscar sitio o unidad..." 
                   class="w-full pl-10 pr-4 py-2 bg-slate-100 border-none rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
                   onkeyup="filtrarSitios()">
        </div>
    </div>

    <div id="site-list" class="flex-1 overflow-y-auto site-list bg-white"></div>
</div>

<div id="diag-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[2000] flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
        <div class="p-6 border-b flex justify-between items-center bg-slate-50">
            <div>
                <h3 id="modal-title" class="text-lg font-bold text-slate-800">Diagnóstico de Unidad</h3>
                <p id="modal-subtitle" class="text-xs text-slate-500 font-medium"></p>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div class="p-6 space-y-4">
            <div id="ai-analysis-content" class="space-y-3"></div>
        </div>
        <div class="p-4 bg-slate-50 border-t flex justify-end">
            <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm font-bold">Cerrar Monitor</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const geoInventory = {
    "MX_CM_VV_COL_669": { lat: 19.4270, lng: -99.1670 },
    "MX_CM_EV_MGP_15": { lat: 19.4350, lng: -99.1410 },
    "SITIO_TEST_01": { lat: 19.4180, lng: -99.1620 }
};

let map, markers = {}, currentData = [];

function initMap() {
    map = L.map('map', { zoomControl: false }).setView([19.43, -99.13], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CartoDB'
    }).addTo(map);
    
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    fetchData();
    setInterval(fetchData, 10000);
}

async function fetchData() {
    try {
        const response = await fetch('/api/data').catch(() => ({
            json: async () => [
                { name: "MX_CM_VV_COL_669", latency: 58, cpu_usage: 82, ram_usage: 45, unit: "NUC-V3" },
                { name: "MX_CM_EV_MGP_15", latency: 12, cpu_usage: 30, ram_usage: 20, unit: "NUC-V2" }
            ]
        }));
        
        currentData = await response.json();
        updateDashboard();
    } catch (e) {
        console.error("Error en sincronización:", e);
    }
}

function updateDashboard() {
    const listCont = document.getElementById('site-list');
    let kpis = { red: 0, yellow: 0, green: 0 };
    listCont.innerHTML = "";

    currentData.forEach(unidad => {
        const idLimpia = unidad.name.trim();
        const coords = geoInventory[idLimpia];
        
        let color = "#10b981"; 
        if (unidad.latency > 50 || unidad.cpu_usage > 75) { 
            color = "#ef4444"; kpis.red++;
        } else if (unidad.latency > 30 || unidad.cpu_usage > 60) { 
            color = "#f59e0b"; kpis.yellow++;
        } else {
            kpis.green++;
        }

        if (coords) {
            renderMarker(idLimpia, coords, unidad, color);
        }

        listCont.innerHTML += `
            <div class="group p-4 border-b hover:bg-slate-50 cursor-pointer transition-all flex justify-between items-center" 
                 onclick="focusUnidad('${idLimpia}', ${coords?.lat}, ${coords?.lng})">
                <div class="flex flex-col">
                    <span class="text-[11px] font-bold text-slate-800">${idLimpia}</span>
                    <span class="text-[9px] text-slate-400 uppercase tracking-tighter">${unidad.unit || 'Generic NUC'}</span>
                </div>
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <div class="text-xs font-black" style="color:${color}">${unidad.latency}ms</div>
                        <div class="text-[9px] text-slate-400">${unidad.cpu_usage}% CPU</div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-300 group-hover:translate-x-1 transition-transform text-[10px]"></i>
                </div>
            </div>`;
    });

    document.getElementById('count-red').innerText = kpis.red;
    document.getElementById('count-yellow').innerText = kpis.yellow;
    document.getElementById('count-green').innerText = kpis.green;
}

function renderMarker(id, coords, data, color) {
    if (markers[id]) map.removeLayer(markers[id]);
    const offset = 0.001125; 
    const bounds = [[coords.lat - offset, coords.lng - offset], [coords.lat + offset, coords.lng + offset]];
    
    const square = L.rectangle(bounds, {
        color: color, weight: 1.5, fillColor: color, fillOpacity: 0.4, className: color === '#ef4444' ? 'status-pulse' : ''
    }).addTo(map);

    const popupHTML = `
        <div class="p-3 font-sans" style="min-width:200px">
            <div class="flex justify-between items-center mb-2">
                <b class="text-sm">${id}</b>
                <span class="text-[9px] bg-slate-100 px-2 py-0.5 rounded text-slate-500 font-bold uppercase">${data.unit}</span>
            </div>
            <div class="grid grid-cols-2 gap-y-2 text-[11px] border-t pt-2 mt-2">
                <span class="text-slate-500">Latencia:</span> <b class="text-right">${data.latency}ms</b>
                <span class="text-slate-500">Uso CPU:</span> <b class="text-right">${data.cpu_usage}%</b>
                <span class="text-slate-500">RAM:</span> <b class="text-right">${data.ram_usage}%</b>
            </div>
            <button onclick="openDiagnosis('${id}')" 
                    class="mt-4 w-full bg-slate-900 text-white py-2 rounded-lg text-[10px] font-bold uppercase hover:bg-indigo-600 transition-all">
                <i class="fa-solid fa-robot mr-1"></i> Análisis Proactivo IA
            </button>
        </div>`;

    square.bindPopup(popupHTML, { className: 'custom-popup' });
    markers[id] = square;
}

function openDiagnosis(id) {
    const unidad = currentData.find(u => u.name === id);
    if (!unidad) return;

    document.getElementById('modal-title').innerText = id;
    document.getElementById('modal-subtitle').innerText = `Sensor Status: ${unidad.unit}`;
    const content = document.getElementById('ai-analysis-content');
    content.innerHTML = "";

    const hallazgos = [];
    if (unidad.latency > 50) hallazgos.push({icon: 'fa-signal', color: 'text-rose-500', msg: 'Latencia crítica detectada. Posible degradación de red.'});
    if (unidad.cpu_usage > 75) hallazgos.push({icon: 'fa-microchip', color: 'text-amber-500', msg: 'Carga de CPU elevada.'});
    if (hallazgos.length === 0) hallazgos.push({icon: 'fa-check-circle', color: 'text-emerald-500', msg: 'Sistema operando normalmente.'});

    hallazgos.forEach(h => {
        content.innerHTML += `
            <div class="flex gap-4 p-3 bg-slate-50 rounded-xl border border-slate-100">
                <i class="fa-solid ${h.icon} ${h.color} mt-1 text-lg"></i>
                <p class="text-xs text-slate-700 leading-relaxed">${h.msg}</p>
            </div>`;
    });
    document.getElementById('diag-modal').classList.remove('hidden');
}

function closeModal() { document.getElementById('diag-modal').classList.add('hidden'); }

function focusUnidad(id, lat, lng) {
    if (!lat) return;
    map.flyTo([lat, lng], 17, { duration: 1.5 });
    markers[id].openPopup();
}

function filtrarSitios() {
    const q = document.getElementById('site-search').value.toLowerCase();
    document.querySelectorAll('.group').forEach(item => {
        item.style.display = item.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
    });
}

document.addEventListener('DOMContentLoaded', initMap);
</script>
</body>
</html>
